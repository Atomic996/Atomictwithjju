<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bluesminds AI Agent</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f172a; color:#f1f5f9; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; }

  header { padding:14px 20px; background:#1e293b; border-bottom:1px solid #334155; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:17px; font-weight:800; }
  .badge { background:rgba(14,165,233,0.15); border:1px solid rgba(14,165,233,0.3); color:#38bdf8; padding:3px 10px; border-radius:20px; font-size:11px; font-family:monospace; }

  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }

  .welcome { text-align:center; margin-top:50px; color:#475569; }
  .welcome .icon { font-size:44px; margin-bottom:12px; }
  .quick { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .quick button { background:#1e293b; border:1px solid #334155; color:#94a3b8; padding:7px 14px; border-radius:20px; font-size:13px; cursor:pointer; font-family:sans-serif; }
  .quick button:hover { border-color:#38bdf8; color:#38bdf8; }

  .msg { display:flex; }
  .msg.user { justify-content:flex-start; }
  .msg.ai { justify-content:flex-end; }
  .bubble { max-width:75%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.8; white-space:pre-wrap; }
  .msg.user .bubble { background:#1e293b; color:#cbd5e1; border-bottom-right-radius:3px; }
  .msg.ai .bubble { background:#0ea5e9; color:#fff; border-bottom-left-radius:3px; }

  .thinking .bubble { background:#0ea5e9; color:#fff; border-bottom-left-radius:3px; }

  .error { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; padding:10px 14px; border-radius:10px; font-size:12px; font-family:monospace; white-space:pre-wrap; }

  .input-area { padding:12px 16px 16px; background:#1e293b; border-top:1px solid #334155; display:flex; gap:8px; }
  textarea { flex:1; background:#0f172a; border:1px solid #334155; border-radius:10px; padding:10px 14px; color:#f1f5f9; font-size:14px; outline:none; direction:rtl; resize:none; font-family:sans-serif; min-height:44px; max-height:120px; }
  textarea:focus { border-color:#38bdf8; }
  button#send { padding:0 20px; border-radius:10px; border:none; cursor:pointer; background:#0ea5e9; color:#fff; font-weight:700; font-size:14px; font-family:sans-serif; }
  button#send:disabled { background:#334155; cursor:not-allowed; }
</style>
</head>
<body>

<header>
  <h1>🤖 Bluesminds AI Agent</h1>
  <span class="badge">claude-opus-4-6</span>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <div class="icon">⚡</div>
    <p>متصل بـ bluesminds عبر السيرفر المحلي</p>
    <div class="quick">
      <button onclick="sendQuick('مرحبا!')">👋 مرحبا</button>
      <button onclick="sendQuick('ما هو Solana؟')">⛓ Solana</button>
      <button onclick="sendQuick('ما هو مشروع Bulk Trade؟')">📊 Bulk Trade</button>
    </div>
  </div>
</div>

<div class="input-area">
  <textarea id="input" placeholder="اكتب هنا..." rows="1"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
    oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"
  ></textarea>
  <button id="send" onclick="send()">إرسال</button>
</div>

<script>
  let history = [];
  let loading = false;

  function sendQuick(t) { document.getElementById('input').value = t; send(); }

  async function send() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text || loading) return;

    document.getElementById('welcome')?.remove();
    input.value = '';
    input.style.height = 'auto';

    addMsg('user', text);
    const thinkEl = addThinking();
    setLoading(true);

    try {
      const res = await fetch('http://localhost:3000/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history })
      });

      const data = await res.json();
      thinkEl.remove();

      if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + (data?.error?.message || data?.error || ''));

      const reply = data?.content?.[0]?.text || 'لا يوجد رد';
      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: reply });
      addMsg('ai', reply);

    } catch(e) {
      thinkEl.remove();
      addError(e.message);
    } finally {
      setLoading(false);
    }
  }

  function addMsg(role, text) {
    const chat = document.getElementById('chat');
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.innerHTML = `<div class="bubble">${text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>`;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function addThinking() {
    const chat = document.getElementById('chat');
    const d = document.createElement('div');
    d.className = 'msg ai thinking';
    d.innerHTML = '<div class="bubble">●●●</div>';
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function addError(msg) {
    const chat = document.getElementById('chat');
    const d = document.createElement('div');
    d.className = 'error';
    d.textContent = '❌ ' + msg + '\n\nتأكد أن السيرفر يعمل:\nnode server.js';
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function setLoading(v) {
    loading = v;
    document.getElementById('send').disabled = v;
  }
</script>
</body>
</html>
